    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <script>
      // Match useTheme before first paint, including older saved preferences.
      let theme = 'classic-system'
      try { theme = localStorage.getItem('crticket-theme') || theme } catch {}
      if (['system', 'light', 'dark'].includes(theme)) theme = `contrast-${theme}`
      if (!/^(classic|contrast)-(system|light|dark)$/.test(theme)) theme = 'classic-system'
      const native = window.CRTicketAndroid
      const systemDark = typeof native?.systemDarkMode === 'function'
        ? native.systemDarkMode()
        : matchMedia('(prefers-color-scheme: dark)').matches
      const dark = theme.endsWith('-dark') || (theme.endsWith('-system') && systemDark)
      document.documentElement.classList.toggle('dark', dark)
      document.documentElement.classList.toggle('high-contrast', theme.startsWith('contrast-'))
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
    </script>
