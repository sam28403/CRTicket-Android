<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="leaflet.css">
  <style>
    html, body { margin: 0; background: #e8ece6; }
    #map { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    .leaflet-control-attribution { font-size: 11px; }
    #error {
      position: absolute; z-index: 1000; left: 12px; right: 12px; bottom: 32px;
      padding: 12px; border-radius: 16px; background: #fff4dc; color: #493e24;
      font: 14px sans-serif; display: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="error"></div>
  <script src="leaflet.js"></script>
  <script>
    const segments = __SEGMENTS__;
    const map = L.map('map', { zoomControl: true });
    const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    tiles.on('tileerror', () => {
      const error = document.getElementById('error');
      error.textContent = __MAP_ERROR__;
      error.style.display = 'block';
    });
    const points = segments.flat();
    segments.forEach(segment => {
      L.polyline(segment, { color: '#41694b', weight: 5 }).addTo(map);
    });
    if (points.length) {
      L.circleMarker(points[0], { radius: 7, color: '#ffffff', fillColor: '#41694b', fillOpacity: 1 }).addTo(map);
      L.circleMarker(points[points.length - 1], { radius: 7, color: '#ffffff', fillColor: '#b33c35', fillOpacity: 1 }).addTo(map);
    }
    function fitTrack() {
      // Android WebView can keep percentage/vh heights at zero after its first layout.
      document.getElementById('map').style.height = Math.max(window.innerHeight, 1) + 'px';
      map.invalidateSize();
      if (!points.length) map.setView([35, 105], 4);
      else if (points.length === 1) map.setView(points[0], 13);
      else map.fitBounds(L.latLngBounds(points), { padding: [32, 32], maxZoom: 16 });
    }
    fitTrack();
    window.addEventListener('resize', fitTrack);
    requestAnimationFrame(fitTrack);
    new ResizeObserver(fitTrack).observe(document.getElementById('map'));
  </script>
</body>
</html>
